services:
  postgres:
    image: postgres:17
    container_name: api-monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    redis:
      image: redis:8-alpine
      container_name: api-monitoring-redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data

volumes:
  postgres_data:
